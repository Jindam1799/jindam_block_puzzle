<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>진담 중국어 블록 퍼즐</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="light-flash-overlay"></div>

    <div id="start-screen">
      <h1 class="blink-text">화면을 터치하거나<br />아무 키나 누르세요</h1>
    </div>

    <div id="lobby-screen" style="display: none">
      <h1 class="lobby-title">진담 중국어</h1>
      <p class="lobby-subtitle">중국어 블록 퍼즐</p>

      <div class="level-select-container">
        <button id="btn-lv1" class="level-btn active" onclick="selectLevel(1)">
          LEVEL 1<br /><span style="font-size: 9pt; font-weight: normal"
            >기초 단어/문장</span
          >
        </button>
        <button id="btn-lv2" class="level-btn" onclick="selectLevel(2)">
          LEVEL 2<br /><span style="font-size: 9pt; font-weight: normal"
            >문장</span
          >
        </button>
      </div>

      <div class="mode-buttons">
        <button class="mode-btn normal-btn" onclick="startGame('normal')">
          NORMAL MODE<br />
        </button>
        <button class="mode-btn hell-btn" onclick="startGame('hell')">
          HELL MODE<br />
        </button>
        <button class="mode-btn rank-btn" onclick="showRankingScreen('normal')">
          🏆 명예의 전당 (랭킹)
        </button>
      </div>
    </div>

    <div id="ranking-screen" style="display: none">
      <h2
        style="
          color: #00ffcc;
          margin-bottom: 20px;
          font-size: 24pt;
          text-shadow: 0 0 10px #00ffcc;
        "
      >
        명예의 전당
      </h2>
      <div class="ranking-tabs">
        <button
          id="tab-normal"
          class="tab-btn active"
          onclick="renderRankingList('normal')"
        >
          NORMAL
        </button>
        <button
          id="tab-hell"
          class="tab-btn"
          onclick="renderRankingList('hell')"
        >
          HELL 🔥
        </button>
      </div>
      <div class="ranking-list-container">
        <ul id="ranking-list"></ul>
      </div>
      <button
        class="option-btn"
        onclick="returnToLobby()"
        style="
          margin-top: 20px;
          background: linear-gradient(135deg, #4facfe, #00f2fe);
        "
      >
        로비로 돌아가기
      </button>
    </div>

    <div id="game-container" style="display: none">
      <header>
        <div class="score-box">SCORE: <span id="score">0</span></div>
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
          "
        >
          <div class="title-box">
            모드: <span id="mode-display">NORMAL</span>
          </div>
          <!-- ★ 포기하기 버튼 추가 ★ -->
          <button class="give-up-btn" onclick="showGiveUpModal()">
            🏠 로비로 돌아가기
          </button>
        </div>
      </header>

      <div id="combo-display" class="combo-text"></div>
      <div id="all-clear-display" class="all-clear-text">
        ALL CLEAR!<br /><span style="font-size: 18pt; color: #fff"
          >+1000 SCORE</span
        >
      </div>

      <div id="quiz-modal" class="modal" style="z-index: 300">
        <div
          class="modal-content"
          style="
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
          "
        >
          <h3 style="color: #00ffcc; margin-bottom: 15px">퀴즈!</h3>

          <p
            id="quiz-question"
            style="
              font-size: 25pt;
              font-weight: bold;
              color: #fff;
              margin-bottom: 10px;
            "
          ></p>

          <div
            style="
              display: flex;
              justify-content: center;
              gap: 10px;
              margin-bottom: 15px;
            "
          >
            <button
              id="tts-replay-btn"
              onclick="replayTTS()"
              style="
                background: rgba(255, 102, 204, 0.1);
                border: 1px solid #ff66cc;
                color: #ff66cc;
                padding: 8px 15px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                transition: 0.2s;
              "
            >
              🔊 음성 다시듣기
            </button>
            <button
              id="hint-btn"
              onclick="showHint()"
              style="
                background: rgba(0, 255, 204, 0.1);
                border: 1px solid #00ffcc;
                color: #00ffcc;
                padding: 8px 15px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                transition: 0.2s;
              "
            >
              💡 병음 힌트 보기
            </button>
          </div>

          <p
            id="quiz-pinyin"
            style="
              display: none;
              color: #ff00ff;
              font-size: 16pt;
              margin-bottom: 20px;
              font-style: italic;
              letter-spacing: 2px;
            "
          ></p>

          <div id="quiz-options"></div>
          <p id="quiz-feedback" class="feedback"></p>
        </div>
      </div>
      <!-- ★ 복습 모달 (게임 오버 시 표시) ★ -->
      <div id="review-modal" class="modal" style="z-index: 350">
        <div
          class="modal-content"
          style="
            border-color: #f6d365;
            box-shadow: 0 0 30px rgba(246, 211, 101, 0.4);
            height: 75vh;
            display: flex;
            flex-direction: column;
          "
        >
          <h3
            style="
              color: #f6d365;
              text-shadow: 0 0 10px #f6d365;
              font-size: 20pt;
              margin-bottom: 10px;
            "
          >
            학습 복습하기 📚
          </h3>
          <p style="color: #ccc; margin-bottom: 15px; font-size: 12pt">
            이번 판에 맞힌 문장들을 다시 들어보세요!
          </p>

          <div
            id="review-list"
            style="
              overflow-y: auto;
              flex: 1;
              margin-bottom: 20px;
              text-align: left;
              padding: 0 5px;
            "
          >
            <!-- 복습 아이템들이 여기에 동적으로 추가됨 -->
          </div>

          <button
            class="option-btn"
            onclick="goToGameOverModal()"
            style="
              background: linear-gradient(135deg, #4facfe, #00f2fe);
              margin-bottom: 0;
            "
          >
            랭킹 등록하러 가기 ➡️
          </button>
        </div>
      </div>
      <!-- 게임 오버 모달 -->
      <div id="game-over-modal" class="modal">
        <div
          class="modal-content"
          style="
            border-color: #ff003c;
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.4);
          "
        >
          <h3
            style="
              color: #ff003c;
              text-shadow: 0 0 10px #ff003c;
              font-size: 20pt;
              margin-bottom: 10px;
            "
          >
            GAME OVER
          </h3>
          <p
            id="game-over-stats"
            style="
              font-size: 13pt;
              margin-bottom: 20px;
              line-height: 1.6;
              color: #e0e0e0;
            "
          ></p>

          <input
            type="text"
            id="nickname-input"
            placeholder="닉네임 입력 (최대 6자)"
            maxlength="6"
            autocomplete="off"
          />

          <!-- ★ 버튼 두 개로 분리 ★ -->
          <div style="display: flex; gap: 10px">
            <button
              class="option-btn"
              onclick="saveRanking()"
              style="
                background: linear-gradient(135deg, #ff0844, #ffb199);
                margin-bottom: 0;
                flex: 6;
              "
            >
              랭킹 등록
            </button>
            <button
              class="option-btn"
              onclick="skipRankingAndGoLobby()"
              style="
                background: rgba(255, 255, 255, 0.2);
                margin-bottom: 0;
                flex: 4;
                font-size: 11pt;
              "
            >
              로비로 가기
            </button>
          </div>
        </div>
      </div>

      <div id="alert-modal" class="modal" style="z-index: 300">
        <div
          class="modal-content"
          style="
            border-color: #ffaa00;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.4);
          "
        >
          <h3
            style="
              color: #ffaa00;
              text-shadow: 0 0 10px #ffaa00;
              font-size: 18pt;
              margin-bottom: 15px;
            "
          >
            알림
          </h3>
          <p
            style="
              font-size: 14pt;
              margin-bottom: 25px;
              line-height: 1.6;
              color: #fff;
            "
          >
            이름을 남겨주시오!<br /><span style="font-size: 11pt; color: #aaa"
              >(닉네임을 입력해주세요)</span
            >
          </p>
          <button
            class="option-btn"
            onclick="closeAlertModal()"
            style="
              background: linear-gradient(135deg, #f6d365, #fda085);
              color: #000;
              box-shadow: 0 0 15px rgba(253, 160, 133, 0.5);
            "
          >
            확인
          </button>
        </div>
      </div>

      <div id="board-wrapper">
        <div id="grid-board"></div>
      </div>

      <div id="block-dock">
        <div class="dock-slot" id="slot-0" data-slot="0"></div>
        <div class="dock-slot" id="slot-1" data-slot="1"></div>
        <div class="dock-slot" id="slot-2" data-slot="2"></div>
      </div>
    </div>

    <!-- ★ 로비로 돌아가기 확인 모달 ★ -->
    <div id="giveup-modal" class="modal" style="z-index: 400">
      <div
        class="modal-content"
        style="
          border-color: #ff3333;
          box-shadow: 0 0 30px rgba(255, 51, 51, 0.4);
        "
      >
        <h3
          style="
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333;
            font-size: 18pt;
            margin-bottom: 15px;
          "
        >
          게임 종료
        </h3>
        <p
          style="
            font-size: 14pt;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #fff;
          "
        >
          정말 로비로 돌아가시겠습니까?<br />
          <span style="font-size: 11pt; color: #aaa"
            >(지금까지 맞힌 문장들을 복습합니다.)</span
          >
        </p>
        <div style="display: flex; gap: 10px">
          <button
            class="option-btn"
            onclick="processGiveUp(true)"
            style="
              background: linear-gradient(135deg, #ff0844, #ffb199);
              margin-bottom: 0;
            "
          >
            예
          </button>
          <button
            class="option-btn"
            onclick="processGiveUp(false)"
            style="background: rgba(255, 255, 255, 0.2); margin-bottom: 0"
          >
            아니오
          </button>
        </div>
      </div>
    </div>

    <div id="drag-overlay"></div>

    <script src="data.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
